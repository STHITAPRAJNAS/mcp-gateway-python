upstreams:
  - id: pg
    name: Postgres MCP
    base_url: http://postgres-mcp:8000
    transport: http
    tags: [data, sql]
    mutable_tools: [execute_sql, write_row, delete_row]

  - id: gh
    name: GitHub MCP
    base_url: http://github-mcp:8000
    transport: http
    auth_header: Authorization
    auth_token: "Bearer changeme"
    tags: [scm, github]
    mutable_tools: [create_issue, create_pr, merge_pr]

  - id: search
    name: Web Search MCP
    base_url: http://search-mcp:8000
    transport: http
    tags: [search, readonly]

auth:
  enabled: true
  oidc:
    enabled: false               # set true + configure below for JWT/OIDC
    algorithms: [RS256]
    jwks_url: "https://idp.example.com/.well-known/jwks.json"
    issuer: "https://idp.example.com"
    audience: "mcp-gateway"
    agent_id_claim: sub
    jwks_cache_ttl: 300
    # For HS256 (internal services):
    # algorithms: [HS256]
    # secret: "supersecret"
  mutable_allowed_agents:
    - ops-bot
    - release-agent
  agent_permissions:
    readonly-agent:
      - pg.list_tables
      - pg.describe_table
      - search.query
    ops-bot:
      - "*"

redaction:
  enabled: true
  redact_requests: true
  redact_responses: true
  score_threshold: 0.5
  entities:
    - EMAIL_ADDRESS
    - PHONE_NUMBER
    - CREDIT_CARD
    - US_SSN
    - IP_ADDRESS

guardrails:
  enabled: true
  rules:
    - name: no-destructive-sql
      tool: execute_sql
      forbidden_substrings: ["DROP TABLE", "TRUNCATE", "DELETE FROM"]
      forbidden_regex:
        - "(?i)\\bDROP\\s+DATABASE\\b"
    - name: bounded-pagination
      tool: "*"
      numeric_ranges:
        limit: { min: 1, max: 1000 }
        offset: { min: 0, max: 100000 }
    - name: no-secret-keys
      tool: "*"
      forbidden_regex:
        - "sk-[A-Za-z0-9]{10,}"

rate_limiting:
  enabled: true
  default_agent_rate: 10.0      # tokens/sec per agent (global)
  default_agent_burst: 20.0
  default_tool_rate: 5.0        # tokens/sec per (agent, tool)
  default_tool_burst: 10.0
  agents:
    ops-bot:
      agent_rate: 50.0
      agent_burst: 100.0
  tools:
    pg.execute_sql:
      rate: 2.0
      burst: 4.0

circuit_breaker:
  enabled: true
  failure_threshold: 5          # consecutive failures before OPEN
  recovery_timeout: 30.0        # seconds to wait before probing
  probe_successes: 2            # successes in HALF_OPEN to CLOSE

naming:
  strategy: prefix_always    # prefix_always | prefix_on_conflict | bare
  on_conflict: warn          # warn | error | suffix

# Example per-server auth configs:
#
# Static with env-var expansion:
#   server_auth:
#     strategy: static
#     header: Authorization
#     token: "${GITHUB_TOKEN}"
#
# Read from env at call time (for rotated secrets):
#   server_auth:
#     strategy: env
#     header: Authorization
#     env_var: POSTGRES_MCP_TOKEN
#
# OAuth2 client_credentials with auto-refresh:
#   server_auth:
#     strategy: oauth2
#     header: Authorization
#     oauth2_token_url: https://auth.example.com/oauth/token
#     oauth2_client_id: mcp-gateway
#     oauth2_client_secret_env: CRM_CLIENT_SECRET
#     oauth2_scope: crm.read crm.write
#     oauth2_refresh_buffer: 60
#
# Forward calling agent id to upstream for server-side attribution:
#     forward_agent_id_header: X-Forwarded-Agent
